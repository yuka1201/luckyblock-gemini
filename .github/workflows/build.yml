name: Build Lucky Block MOD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Find Gradle project and Build
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle が見つかりませんでした。リポジトリ構成を確認してください。"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Gradleプロジェクトを検出しました: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: luckyblock-mod-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
