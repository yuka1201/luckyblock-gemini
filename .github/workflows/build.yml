- name: Build with Gradle
        working-directory: lucky-block-mod-26.3-fabric
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: luckyblock-mod-jar
          path: |
            lucky-block-mod-26.3-fabric/build/libs/*.jar
            !lucky-block-mod-26.3-fabric/build/libs/*-sources.jar
